# Paste this into .github/workflows/coretexa-verify.yml
name: coretexa-verify

on: pull_request

permissions:
  contents: read
  pull-requests: write   # only needed for the PR comment

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # required: we need the merge base

      - uses: earfman/coretexa-verify@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # fail-on: no-gate       # uncomment to make NO_GATE block the merge

# That is the whole file. coretexa-verify detects and installs your project's
# own declared test dependencies itself, and prints the command it chose and
# the evidence for it.
#
# If you would rather install them yourself, add your own step and turn ours
# off:
#
#       - run: pip install -e ".[dev]"
#       - uses: earfman/coretexa-verify@v1
#         with:
#           install-deps: false
#
# Or keep ours in the sequence but tell it exactly what to run:
#
#       - uses: earfman/coretexa-verify@v1
#         with:
#           install-command: make test-deps
