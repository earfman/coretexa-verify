[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coretexa-verify"
version = "1.3.0"
description = "Does this pull request's own test suite actually gate its fix?"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "coretexa" }]
keywords = ["testing", "mutation-testing", "pull-request", "ci", "github-action"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
# No runtime dependencies, on purpose: the GitHub Action must not have to
# install anything into the user's environment before it can run.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
coretexa-verify = "coretexa_verify.cli:main"

[project.urls]
Homepage = "https://github.com/earfman/coretexa-verify"
Source = "https://github.com/earfman/coretexa-verify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
