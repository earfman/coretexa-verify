name: coretexa-verify
description: >-
  Can this pull request's own new tests actually fail? Reverts the source,
  keeps the tests, runs them again.
author: coretexa
branding:
  icon: shield
  color: purple

inputs:
  base-ref:
    description: >-
      Base branch or ref to compare against. Defaults to the pull request's base
      branch (GITHUB_BASE_REF), so you normally do not set this.
    required: false
    default: ""
  head-ref:
    description: "Head ref to analyse. Defaults to the checked-out HEAD."
    required: false
    default: "HEAD"
  fail-on:
    description: >-
      When to fail the job. One of: never (default, non-blocking), no-gate,
      no-gate-or-inconclusive, not-gate-holds.
    required: false
    default: "never"
  timeout:
    description: "Per test-run timeout in seconds."
    required: false
    default: "900"
  install-deps:
    description: >-
      Detect and install the repository's own test dependencies before running
      (default true). Detection reads only files the repo already committed -
      uv.lock, poetry config, a test/dev extra in pyproject.toml, a
      requirements file, a JS lockfile - and the chosen command plus the
      evidence for it always appear in the report. Set to false to use the
      environment exactly as your workflow left it.
    required: false
    default: "true"
  install-command:
    description: >-
      Explicit install command. Overrides detection entirely. Shell syntax
      (&&, pipes, redirects) is run through `/bin/sh -c`; anything simpler runs
      as argv with no shell in between.
    required: false
    default: ""
  install-timeout:
    description: "Timeout in seconds for each dependency-install command."
    required: false
    default: "600"
  test-command:
    description: >-
      Explicit test command. Overrides runner detection entirely and runs from
      the repository root. Use this for a toolchain the detectors do not cover -
      a Makefile target, a Bazel invocation, a shell script. Shell syntax
      (&&, pipes, globs) goes through `/bin/sh -c`; anything simpler runs as
      argv. The selected test targets replace `{targets}` if the command
      contains it, and are appended otherwise.
    required: false
    default: ""
  junit-path:
    description: >-
      File or directory of JUnit XML that `test-command` writes. With it, per-
      test counts and the assertion-vs-build distinction are read from the
      report and are exactly as precise as for a detected runner. Without it,
      results are classified from the exit code alone using a declared text
      heuristic that is printed with every run.
    required: false
    default: ""
  max-collected:
    description: "Refuse to run when a widened selection collects more than this many tests."
    required: false
    default: "500"
  localize:
    description: >-
      Per-hunk localisation. auto (default) drills into individual hunks only
      when the whole-PR revert merely broke the build; always drills in every
      time; never reports only the whole-PR result.
    required: false
    default: "auto"
  localize-budget:
    description: >-
      Wall-clock seconds per-hunk localisation may spend. Stage 1 is two test
      runs; localisation adds one more per behavioural hunk, so a large diff in
      a compiled language can be many full suite runs. Hunks not reached are
      reported as skipped and never counted as ungated. 0 disables the limit.
    required: false
    default: "600"
  github-token:
    description: >-
      Token used to post/update a single PR comment. Omit it and no comment is
      written. Needs `pull-requests: write`.
    required: false
    default: ""
  comment:
    description: "Set to false to skip the PR comment even when a token is provided."
    required: false
    default: "true"
  working-directory:
    description: "Repository root to analyse. Defaults to the workspace."
    required: false
    default: ""
  test-globs:
    description: "Whitespace-separated globs forced to be treated as TEST files."
    required: false
    default: ""
  source-globs:
    description: "Whitespace-separated globs forced to be treated as SOURCE files."
    required: false
    default: ""

outputs:
  verdict:
    description: >-
      One of NO_GATE, GATE_HOLDS, GATE_HOLDS_BUILD, NO_NEW_TESTS, INCONCLUSIVE.
    value: ${{ steps.verify.outputs.verdict }}
  details:
    description: "One-line explanation of the verdict."
    value: ${{ steps.verify.outputs.details }}
  json:
    description: "The full machine-readable report as compact JSON."
    value: ${{ steps.verify.outputs.json }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory || github.workspace }}
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_LOCALIZE: ${{ inputs.localize }}
        INPUT_LOCALIZE_BUDGET: ${{ inputs.localize-budget }}
        INPUT_MAX_COLLECTED: ${{ inputs.max-collected }}
        INPUT_INSTALL_DEPS: ${{ inputs.install-deps }}
        INPUT_INSTALL_COMMAND: ${{ inputs.install-command }}
        INPUT_INSTALL_TIMEOUT: ${{ inputs.install-timeout }}
        INPUT_TEST_COMMAND: ${{ inputs.test-command }}
        INPUT_JUNIT_PATH: ${{ inputs.junit-path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_TEST_GLOBS: ${{ inputs.test-globs }}
        INPUT_SOURCE_GLOBS: ${{ inputs.source-globs }}
      run: |
        set -euo pipefail
        # coretexa-verify is pure standard library, so *it* has nothing to install.
        # It uses the interpreter already on PATH - the one your workflow set up -
        # and, unless you set install-deps: false, it detects and installs your
        # project's own declared test dependencies into that interpreter itself.
        PY="${CORETEXA_PYTHON:-python3}"
        "$PY" -c 'import sys; assert sys.version_info >= (3, 9), sys.version' \
          || { echo "::error::coretexa-verify needs Python 3.9+ on PATH"; exit 1; }
        "$PY" -m coretexa_verify.action_main
